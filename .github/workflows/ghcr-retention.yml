name: ghcr-retention

on:
  workflow_call:
    inputs:
      keep:
        description: "Whole releases to retain (current + N-1 for rollback). Minimum 2."
        type: number
        default: 3
      dry-run:
        description: "Log deletions without performing them. Default true (fail-safe)."
        type: boolean
        default: true

permissions: {} # deny by default; the cleanup job below grants only what it needs

concurrency:
  group: ghcr-retention-${{ github.event.repository.name }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Prune old GHCR releases
    runs-on: ubuntu-latest
    permissions:
      packages: write # delete this repo's GHCR package versions via dataaxiom/ghcr-cleanup-action
    timeout-minutes: 15
    steps:
      - name: Guard keep >= 2
        env:
          KEEP: ${{ inputs.keep }}
        run: |
          set -euo pipefail
          if [ "$KEEP" -lt 2 ]; then
            echo "::error::keep must be >= 2 to preserve rollback capacity (got $KEEP)"
            exit 1
          fi
      - name: Prune
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          owner: ${{ github.repository_owner }}
          package: ${{ github.event.repository.name }}
          keep-n-tagged: ${{ inputs.keep }}
          delete-untagged: true
          delete-orphaned-images: true
          validate: true
          dry-run: ${{ inputs.dry-run }}
